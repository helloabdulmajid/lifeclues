# Test profile: these values are placeholders only -
# Testcontainers (@ServiceConnection) overrides them with a throwaway PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=test
spring.datasource.password=test
# The main application.properties pins Hikari connection-timeout to 8s. Inside
# the tests a freshly-started Postgres container can take longer to accept its
# first query than that (especially when several containers start in sequence),
# so give the pool more slack here — this file only affects test runs.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
