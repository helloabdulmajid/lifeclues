spring.application.name=lifeclues
server.port=${LC_PORT:8080}

# --- Database (Neon PostgreSQL) ---
# Credentials come ONLY from environment variables / the .env file.
# The ":}" defaults make a MISSING variable resolve to "" instead of crashing
# Spring with "Could not resolve placeholder". Missing values are caught by the
# friendly checks in LifecluesApplication.main() / dev.sh.
spring.datasource.url=${LC_DB_URL:}
spring.datasource.username=${LC_DB_USER:}
spring.datasource.password=${LC_DB_PASSWORD:}

# --- JPA ---
# Flyway owns the schema. ddl-auto MUST stay disabled: `create` drops every
# table on boot and rebuilds it from JPA entities, silently shredding the
# Flyway migrations (cascades + semantic CHECKs) and wiping data.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Connection pool (HikariCP) ---
# Neon's pooler / the network can close idle connections. Keep lifetimes short,
# re-check connections, and fail fast (not 30s) so a brief blip becomes a quick,
# retryable error instead of a hanging page.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- Flyway (database migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT (access tokens) ---
lifeclues.jwt.secret=${LC_JWT_SECRET:}
lifeclues.jwt.access-expiry-minutes=${LC_ACCESS_EXPIRY_MINUTES:15}

# --- Refresh tokens (opaque, stored hashed in DB) ---
lifeclues.refresh.expiry-days=${LC_REFRESH_EXPIRY_DAYS:7}

# --- Email tokens (verification + password reset, single-use, hashed in DB) ---
lifeclues.verify-token.expiry-minutes=${LC_VERIFY_TOKEN_EXPIRY_MINUTES:30}
lifeclues.reset-token.expiry-minutes=${LC_RESET_TOKEN_EXPIRY_MINUTES:30}

# --- SMTP (Gmail app password) ---
# Leave username blank to run the app without sending email (links are skipped
# but registration / login keep working).
spring.mail.host=${LC_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${LC_MAIL_PORT:587}
spring.mail.username=${LC_MAIL_USERNAME:}
spring.mail.password=${LC_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# "From" address shown on emails; defaults to the SMTP login address.
lifeclues.mail.from=${LC_MAIL_FROM:}
# Optional fixed prefix for emailed links (e.g. https://app.example.com).
# When blank, the app builds links from the incoming request Host/Proto, so
# localhost:5173 works locally and the tunnel host works when deployed.
lifeclues.app.base-url=${LC_APP_BASE_URL:}

# --- CORS (prepare for the React dev server) ---
lifeclues.cors.allowed-origins=${LC_CORS_ORIGINS:http://localhost:5173,https://localui.abdulmajid.in}

# --- Memories (Trash retention) ---
# Trashed memories are hard-deleted after this many days by a nightly sweep.
lifeclues.trash.retention-days=${LC_TRASH_RETENTION_DAYS:30}
